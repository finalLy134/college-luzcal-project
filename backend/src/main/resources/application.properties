# Application
spring.application.name=luzcal
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3308/luzcal?connectionTimeZone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# SQL Logging (Development)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.security=DEBUG

# Timezone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${LUZCAL_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${LUZCAL_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email